[project]
name = "fantasygame"
version = "0.0.1"
description = "Co-op fantasy RPG with turn-based hex combat, built on the 2014 SRD rules."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "panda3d>=1.10.16,<1.11",
    "panda3d-simplepbr",
    "panda3d-gltf",
]

[project.scripts]
fantasygame = "fantasygame.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasygame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: undefined names, unused imports
    "I",       # import sorting
    "B",       # bugbear: common mistakes (e.g. mutable default arguments)
    "UP",      # modern Python syntax
    "N",       # naming conventions
    "SIM",     # simplifications
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
